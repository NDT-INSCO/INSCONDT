name: verify

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Environment
        run: node -v && npm -v

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: EDB library is up to date
        run: npm run edb:check

      - name: Production build
        run: npm run build
